backend:
  name: github
  repo: alaqeela14/mishkat-new
  branch: main
  base_url: https://sveltia-cms-auth.alaqeelafoundation.workers.dev
  auth_endpoint: auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "articles"
    label: "المقالات"
    files:
      - name: "articles-list"
        label: "قائمة المقالات"
        file: "articles.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { label: "التصنيف", name: "category", widget: "select", options: ["مقالات ورؤى", "أهل البيت", "وعي مجتمعي", "رؤى وحلول", "قضايا معاصرة", "حوارات ومقابلات", "شبهات وردود", "التوجيهات الأخلاقية"] }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "عنوان المقال", name: "title", widget: "string" }
              - { label: "اسم الكاتب", name: "author", widget: "string" }
              - { label: "المقتطف", name: "excerpt", widget: "text" }
              - { label: "نص المقال", name: "body", widget: "markdown", required: false }

  - name: "books"
    label: "المكتبة (كتب وملفات)"
    files:
      - name: "books-list"
        label: "قائمة الكتب"
        file: "books.json"
        fields:
          - label: "قائمة الكتب"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} ({{fields.author}})"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "المؤلف", name: "author", widget: "string" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "الوصف", name: "description", widget: "text" }
              - { label: "صورة الغلاف (اختياري)", name: "cover", widget: "image", required: false }
              - { label: "رابط ملف PDF", name: "pdf_url", widget: "string", required: false, hint: "الصق رابط ملف PDF (Drive/Dropbox)" }
              - { label: "رابط ملف Word", name: "word_url", widget: "string", required: false, hint: "الصق رابط ملف Word" }
