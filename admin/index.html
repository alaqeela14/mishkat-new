<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>لوحة إدارة منصة مشكاة</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; margin: 0; background: #f5f8fc; }
    .admin-topbar { background: #1a2b4a; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 4px solid #c9a961; flex-wrap: wrap; }
    .admin-topbar .brand { font-size: 1.1rem; font-weight: 800; color: #c9a961; }
    .admin-topbar .tabs { display: flex; gap: 8px; margin-right: auto; }
    .admin-topbar .tab-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 14px; transition: 0.3s; }
    .admin-topbar .tab-btn:hover { background: rgba(255,255,255,0.1); }
    .admin-topbar .tab-btn.active { background: #c9a961; color: #1a2b4a; border-color: #c9a961; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    #tab-cms iframe { width: 100%; height: calc(100vh - 65px); border: none; display: block; }

    .comments-wrap { max-width: 900px; margin: 30px auto; padding: 0 15px; }
    .login-card { max-width: 400px; margin: 80px auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid #c9a961; }
    .login-card h3 { color: #1a2b4a; text-align: center; margin-bottom: 20px; font-weight: 800; margin-top: 0; }
    .login-card input { width: 100%; padding: 12px; border: 1px solid #e0e6ed; border-radius: 6px; font-family: 'Tajawal', sans-serif; margin-bottom: 15px; font-size: 14px; }
    .login-card button { width: 100%; padding: 12px; background: #1a2b4a; color: white; border: none; border-radius: 6px; font-family: 'Tajawal', sans-serif; font-weight: 700; cursor: pointer; font-size: 15px; }
    .login-card button:hover { background: #c9a961; color: #1a2b4a; }

    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-tabs button { padding: 8px 20px; border: 1px solid #e0e6ed; background: white; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 700; color: #1a2b4a; font-size: 14px; }
    .filter-tabs button.active { background: #1a2b4a; color: white; border-color: #1a2b4a; }

    .comment-card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-right: 4px solid #c9a961; }
    .comment-card .meta { font-size: 0.85rem; color: #6c757d; }
    .comment-card .body { font-size: 1rem; margin: 10px 0; line-height: 1.7; color: #1a1a1a; }
    .comment-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .comment-card .actions button { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 13px; color: white; }
    .btn-approve { background: #16a34a; }
    .btn-approve:hover { background: #15803d; }
    .btn-spam { background: #f59e0b; }
    .btn-spam:hover { background: #d97706; }
    .btn-delete { background: #dc2626; }
    .btn-delete:hover { background: #b91c1c; }

    .status-badge { font-size: 0.72rem; padding: 4px 12px; border-radius: 12px; font-weight: 700; }
    .status-pending { background-color: #fef3c7; color: #92400e; }
    .status-approved { background-color: #d1fae5; color: #065f46; }
    .status-spam { background-color: #fee2e2; color: #991b1b; }

    @media (max-width: 600px) {
      .admin-topbar { padding: 10px; }
      .admin-topbar .tabs { width: 100%; order: 3; }
      .admin-topbar .tab-btn { flex: 1; font-size: 13px; padding: 8px 10px; }
    }
  </style>
</head>
<body>

  <div class="admin-topbar">
    <div class="brand"><i class="fa-solid fa-lightbulb"></i> مشكاة</div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('cms', this)"><i class="fa-solid fa-pen-to-square"></i> المقالات والكتب</button>
      <button class="tab-btn" onclick="switchTab('comments', this)"><i class="fa-solid fa-comments"></i> التعليقات</button>
    </div>
  </div>

  <div class="tab-content active" id="tab-cms">
    <iframe src="/admin/cms.html"></iframe>
  </div>

  <div class="tab-content" id="tab-comments">
    <div class="comments-wrap">
      <div id="login-section">
        <div class="login-card">
          <h3><i class="fa-solid fa-lock"></i> لوحة تحكم التعليقات</h3>
          <input type="password" id="password-input" placeholder="أدخل كلمة المرور">
          <button onclick="login()">دخول</button>
          <p id="login-error" style="color:red; text-align:center; margin-top:15px; display:none;">كلمة المرور غير صحيحة</p>
        </div>
      </div>

      <div id="dashboard-section" style="display:none;">
        <div class="filter-tabs">
          <button class="active" onclick="loadComments('pending', this)">قيد الانتظار</button>
          <button onclick="loadComments('approved', this)">تمت الموافقة</button>
          <button onclick="loadComments('spam', this)">مرفوضة</button>
          <button onclick="logout()" style="margin-right:auto; background:#fee2e2; color:#991b1b; border-color:#fecaca;">خروج</button>
        </div>
        <div id="comments-container">
          <p style="text-align:center; color:#6c757d;">اختر حالة لعرض التعليقات...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.querySelectorAll('.admin-topbar .tab-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    }

    let adminPassword = '';
    let currentStatus = 'pending';

    function login() {
      const pass = document.getElementById('password-input').value;
      adminPassword = pass;
      loadComments(currentStatus, document.querySelector('#dashboard-section .filter-tabs button.active'));
    }

    function logout() {
      adminPassword = '';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('dashboard-section').style.display = 'none';
      document.getElementById('password-input').value = '';
      document.getElementById('login-error').style.display = 'none';
    }

    async function loadComments(status, tabElement) {
      currentStatus = status;
      if (tabElement) {
        document.querySelectorAll('#dashboard-section .filter-tabs button').forEach(el => el.classList.remove('active'));
        tabElement.classList.add('active');
      }
      const container = document.getElementById('comments-container');
      container.innerHTML = '<p style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</p>';

      try {
        const response = await fetch('/api/admin/comments?status=' + status, {
          headers: { 'X-Admin-Password': adminPassword }
        });

        if (response.status === 401) {
          document.getElementById('login-section').style.display = 'block';
          document.getElementById('dashboard-section').style.display = 'none';
          document.getElementById('login-error').style.display = 'block';
          return;
        }

        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';

        const comments = await response.json();

        if (!Array.isArray(comments) || comments.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#6c757d; padding:40px;">لا توجد تعليقات في هذه الحالة.</p>';
          return;
        }

        const statusText = { pending: 'قيد الانتظار', approved: 'تمت الموافقة', spam: 'مرفوض' };

        container.innerHTML = comments.map(c => `
          <div class="comment-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div>
                <strong style="color:#1a2b4a;">${c.author}</strong>
                <span class="meta"> — ${new Date(c.created_at * 1000).toLocaleString('ar-EG')}</span>
              </div>
              <span class="status-badge status-${c.status}">${statusText[c.status] || c.status}</span>
            </div>
            <div class="body">${c.body}</div>
            <div class="meta"><i class="fa-solid fa-link"></i> المقال: ${decodeURIComponent(c.post_slug)}</div>
            <div class="actions">
              ${c.status !== 'approved' ? `<button class="btn-approve" onclick="updateStatus(${c.id}, 'approved')"><i class="fa-solid fa-check"></i> موافقة</button>` : ''}
              ${c.status !== 'spam' ? `<button class="btn-spam" onclick="updateStatus(${c.id}, 'spam')"><i class="fa-solid fa-ban"></i> رفض</button>` : ''}
              <button class="btn-delete" onclick="deleteComment(${c.id})"><i class="fa-solid fa-trash"></i> حذف نهائي</button>
            </div>
          </div>
        `).join('');

      } catch (e) {
        container.innerHTML = '<p style="text-align:center; color:red;">حدث خطأ أثناء تحميل التعليقات.</p>';
      }
    }

    async function updateStatus(id, status) {
      try {
        const response = await fetch('/api/admin/comments', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
          body: JSON.stringify({ id, status })
        });
        if (response.ok) loadComments(currentStatus);
        else alert('فشل تحديث حالة التعليق');
      } catch (e) { alert('خطأ: ' + e.message); }
    }

    async function deleteComment(id) {
      if (!confirm('هل أنت متأكد من حذف هذا التعليق نهائيًا؟')) return;
      try {
        const response = await fetch('/api/admin/comments?id=' + id, {
          method: 'DELETE',
          headers: { 'X-Admin-Password': adminPassword }
        });
        if (response.ok) loadComments(currentStatus);
        else alert('فشل حذف التعليق');
      } catch (e) { alert('خطأ: ' + e.message); }
    }
  </script>
</body>
</html>
